version: "3.8"

services:
  rsu-1:
    image: ${ECR_REGISTRY:-local}/sdis-v2x-mvp:rsu-${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.rsu
    environment:
      - RSU_ID=rsu-1
      - RSU_HTTP_PORT=80
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
    ports:
      - "8081:80"
      - "1883:1883"
    restart: unless-stopped

  rsu-2:
    image: ${ECR_REGISTRY:-local}/sdis-v2x-mvp:rsu-${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.rsu
    environment:
      - RSU_ID=rsu-2
      - RSU_HTTP_PORT=80
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
    ports:
      - "8082:80"
      - "1884:1883"
    restart: unless-stopped

  v2x-service:
    image: ${ECR_REGISTRY:-local}/sdis-v2x-mvp:service-${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.service
    environment:
      - SERVICE_HTTP_PORT=8080
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
    ports:
      - "8080:8080"
    restart: unless-stopped