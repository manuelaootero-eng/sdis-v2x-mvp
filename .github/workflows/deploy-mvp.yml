name: V2X Complete System CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar entorno de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias y pruebas unitarias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m py_compile v2x_logic.py productor_v2x.py rsu.py consumidor_v2x.py test_eventos.py
          python -m unittest test_eventos.py
          echo "Pruebas automáticas superadas con éxito."

      - name: Construir imagen Docker localmente (RSU y V2X-SERVICE)
        run: |
          docker build -f Dockerfile.rsu -t v2x-rsu-image .
          docker build -f Dockerfile.service -t v2x-service-image .

      - name: Configurar credenciales de AWS
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Iniciar sesión en Amazon ECR
        if: github.event_name == 'push'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Etiquetar y publicar imagen en ECR
        if: github.event_name == 'push'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: sdis-v2x-mvp
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV

          docker tag v2x-rsu-image $ECR_REGISTRY/$ECR_REPOSITORY:rsu-latest
          docker tag v2x-rsu-image $ECR_REGISTRY/$ECR_REPOSITORY:rsu-$SHORT_SHA
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:rsu-latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:rsu-$SHORT_SHA

          docker tag v2x-service-image $ECR_REGISTRY/$ECR_REPOSITORY:service-latest
          docker tag v2x-service-image $ECR_REGISTRY/$ECR_REPOSITORY:service-$SHORT_SHA
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:service-latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:service-$SHORT_SHA

      - name: Desplegar versión en instancias EC2 y esperar confirmación
        if: github.event_name == 'push'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ env.SHORT_SHA }}
        run: |
          INSTANCE_IDS=$(aws ec2 describe-instances \
            --filters "Name=tag:V2XApp,Values=true" "Name=instance-state-name,Values=running" \
            --query "Reservations[].Instances[].InstanceId" \
            --output text --region us-east-1)

          if [ -z "$INSTANCE_IDS" ]; then
            echo "Error: No se encontraron instancias EC2 en ejecución con el tag V2XApp=true"
            exit 1
          fi

          # Detectamos el rol de cada instancia por el tag
          PARAMS_JSON=$(jq -n \
            --arg reg "$ECR_REGISTRY" \
            --arg tag "$IMAGE_TAG" \
            '{commands: [
              "aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin " + $reg,
              "TOKEN=$(curl -s -X PUT \"http://169.254.169.254/latest/api/token\" -H \"X-aws-ec2-metadata-token-ttl-seconds: 60\")",
              "IID=$(curl -s -H \"X-aws-ec2-metadata-token: $TOKEN\" http://169.254.169.254/latest/meta-data/instance-id)",
              "ROLE=$(aws ec2 describe-tags --filters \"Name=resource-id,Values=$IID\" \"Name=key,Values=Role,Name\" --query \"Tags[0].Value\" --output text --region us-east-1)",
              "echo \"Desplegando en instancia $IID con rol: $ROLE\"",
              "if echo \"$ROLE\" | grep -iq \"RSU-1\\|RSU1\"; then docker pull " + $reg + "/sdis-v2x-mvp:rsu-" + $tag + " && docker stop rsu-1 || true && docker rm rsu-1 || true && docker run -d --name rsu-1 --restart unless-stopped -p 80:80 -p 1883:1883 -e RSU_ID=rsu-1 -e AWS_DEFAULT_REGION=us-east-1 " + $reg + "/sdis-v2x-mvp:rsu-" + $tag + "; fi",
              "if echo \"$ROLE\" | grep -iq \"RSU-2\\|RSU2\"; then docker pull " + $reg + "/sdis-v2x-mvp:rsu-" + $tag + " && docker stop rsu-2 || true && docker rm rsu-2 || true && docker run -d --name rsu-2 --restart unless-stopped -p 80:80 -p 1883:1883 -e RSU_ID=rsu-2 -e AWS_DEFAULT_REGION=us-east-1 " + $reg + "/sdis-v2x-mvp:rsu-" + $tag + "; fi",
              "if echo \"$ROLE\" | grep -iq \"SERVICE\"; then docker pull " + $reg + "/sdis-v2x-mvp:service-" + $tag + " && docker stop v2x-service || true && docker rm v2x-service || true && docker run -d --name v2x-service --restart unless-stopped -p 8080:8080 -e AWS_DEFAULT_REGION=us-east-1 " + $reg + "/sdis-v2x-mvp:service-" + $tag + "; fi"
            ]}')

          CMD_ID=$(aws ssm send-command \
            --instance-ids $INSTANCE_IDS \
            --document-name "AWS-RunShellScript" \
            --parameters "$PARAMS_JSON" \
            --query "Command.CommandId" \
            --output text --region us-east-1)

          for IID in $INSTANCE_IDS; do
            echo "Esperando ejecución de despliegue ($CMD_ID) en instancia $IID..."
            aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "$IID" --region us-east-1
          done

          
