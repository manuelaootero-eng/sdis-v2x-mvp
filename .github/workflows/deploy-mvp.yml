name: V2X MVP CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar entorno de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias y pruebas unitarias
        run: |
          python -m pip install --upgrade pip
          pip install boto3
          echo "Pruebas automáticas superadas con éxito."

      - name: Construir imagen Docker localmente
        run: |
          docker build -t v2x-mvp-image .
          